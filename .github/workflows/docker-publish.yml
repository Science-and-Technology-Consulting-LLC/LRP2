name: Build and Publish Docker images to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - "container/**"
      - ".github/workflows/docker-publish.yml"

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [ lrp2_lite, cpat, leafcutter_longread, sqanti3_protein, isocall ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set lowercase image name using posix compliant tr
        run: echo "IMAGE_NAME=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tagged by commit only: the config pins this SHA, so a rebuild never changes a past run
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./container/${{ matrix.image }}/
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.image }}:${{ github.sha }}
