name: Build and Deploy Sphinx Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "modules/**"
      - "container/**"
      - "README.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install sphinx myst-parser sphinx-rtd-theme

      - name: Generate Python API docs
        run: |
          sphinx-apidoc -f --separate -o docs/source/ container/lrp2_lite/context/src/lrp2_lite
          sphinx-apidoc -f --separate -o docs/source/ container/leafcutter_longread/context/src/leafcutter_longread

      - name: Ensure docs directories exist
        run: |
          mkdir -p docs/source/_static docs/source/_templates

      - name: Generate Nextflow module docs
        run: python3 docs/parse_nf_docs.py

      - name: Generate R script docs
        run: python3 docs/parse_r_docs.py

      - name: Build Sphinx docs
        run: sphinx-build -b html docs/source docs/build/html

      - name: Verify build succeeded
        run: |
          if [ ! -f docs/build/html/index.html ]; then
            echo "ERROR: Build failed - index.html not found"
            exit 1
          fi
          echo "Build succeeded - index.html exists"

      - name: Create .nojekyll file
        run: touch docs/build/html/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs/build/html'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
